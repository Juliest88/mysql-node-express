openapi: 3.0.0
info:
  title: MySQL Node Express API
  version: 1.0.0
  description: API documentation for MySQL Node Express project
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /api/v1/users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: List of users
    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/v1/users/id/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the user
      responses:
        '200':
          description: User found
        '404':
          description: User not found
    patch:
      summary: Update user by ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User updated
        '404':
          description: User not found
    delete:
      summary: Delete user by ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the user
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found

  /api/v1/users/username/{username}:
    get:
      summary: Get user by username
      tags: [Users]
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: Username
      responses:
        '200':
          description: User found
        '404':
          description: User not found

  /api/v1/users/whoami:
    get:
      summary: Get current user info
      tags: [Users]
      responses:
        '200':
          description: Current user info

  /api/v1/users/login:
    post:
      summary: User login
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials